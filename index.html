tailwind.config = {

    extend: {
      colors: {
        brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',700:'#1e293b',800:'#0f172a',900:'#020617' }
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* { font-family: 'Inter', system-ui, sans-serif; }
body { overflow: hidden; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.step-active { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; }
.card-glow { box-shadow: 0 0 30px rgba(99,102,241,0.08); }
.card-glow:hover { box-shadow: 0 0 40px rgba(99,102,241,0.15); }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
@keyframes spin { to{transform:rotate(360deg)} }
.spinner { animation: spin 1s linear infinite; }
.timeline-line { position:absolute; left:19px; top:0; bottom:0; width:2px; background:linear-gradient(to bottom,#4f46e5,#6366f1,#818cf8); }
.method-tag { font-size:10px; font-weight:700; letter-spacing:0.05em; padding:2px 8px; border-radius:6px; white-space:nowrap; }
.tag-spin-s { background:#3b82f620; color:#60a5fa; }
.tag-spin-p { background:#ef444420; color:#f87171; }
.tag-spin-i { background:#f59e0b20; color:#fbbf24; }
.tag-spin-n { background:#22c55e20; color:#4ade80; }
.tag-pain-surface { background:#a855f720; color:#c084fc; }
.tag-pain-impact { background:#ec489920; color:#f472b6; }
.tag-pain-personal { background:#f4364620; color:#fb7185; }
.tag-challenger { background:#06b6d420; color:#22d3ee; }
.copy-btn { opacity:1; transition:all 0.2s; }
.copy-btn.copied { background:#22c55e; color:white; }
/* Mobile sidebar */
.sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:40; }
.sidebar-overlay.active { display:block; }
@media (max-width:767px) {
  #sidebar { position:fixed; left:-100%; top:0; z-index:50; width:280px; transition:left 0.3s ease; }
  #sidebar.open { left:0; }
  #hamburger-btn { display:flex !important; }
  main { margin-left:0 !important; }
  .sales-tabs-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .sales-tabs-wrap::-webkit-scrollbar { display:none; }
}
@media (min-width:768px) {
  #hamburger-btn { display:none !important; }
  .sidebar-overlay { display:none !important; }
}
@media print {
  .no-print { display:none!important; }
  body { overflow:visible; background:white!important; color:black!important; }
  html.dark body { background:white!important; color:black!important; }
  * { color:black!important; background:transparent!important; box-shadow:none!important; border-color:#ddd!important; }
  main { margin:0!important; padding:20px!important; max-width:100%!important; overflow:visible!important; height:auto!important; }
  .method-tag { border:1px solid #999!important; }
}
/* Accessibility: focus rings */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #818cf8; outline-offset: 2px; border-radius: 4px;
}
a:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
/* WCAG AA contrast helpers */
.text-gray-400 { color: #9ca3af !important; } /* 4.64:1 on dark bg */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#0f172a; }
::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#475569; }
</style>
</head>
<body class="bg-surface-900 text-gray-100 h-screen flex">

<!-- Mobile hamburger -->
<button id="hamburger-btn" onclick="toggleMobileMenu()" class="fixed top-4 left-4 z-50 w-10 h-10 rounded-xl bg-surface-800 border border-gray-700/50 items-center justify-center text-gray-300 hover:text-white hover:bg-gray-700 transition-all shadow-lg" style="display:none;" aria-label="Open navigation menu">
  <i data-lucide="menu" class="w-5 h-5"></i>
</button>
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeMobileMenu()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="no-print w-64 bg-surface-800 border-r border-gray-700/50 flex flex-col shrink-0 h-screen" role="navigation" aria-label="Step navigation">
  <div class="p-5 border-b border-gray-700/50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center">
        <i data-lucide="rocket" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm text-white">Marketing Copilot</h1>
        <p class="text-[10px] text-gray-400 tracking-wide uppercase">CEO Edition</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="nav-steps"></nav>
  <div class="p-3 border-t border-gray-700/50">
    <button onclick="openSettings()" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-700/50 hover:text-white transition-all">
      <i data-lucide="settings" class="w-4 h-4"></i> API Settings
    </button>
    <button onclick="toggleTheme()" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-700/50 hover:text-white transition-all mt-1">
      <i data-lucide="sun" class="w-4 h-4" id="theme-icon"></i> <span id="theme-label">Light Mode</span>
    </button>
  </div>
</aside>

<!-- Main -->
<main class="flex-1 overflow-y-auto h-screen" role="main" aria-label="Main content">
  <div id="main-content" class="max-w-5xl mx-auto p-8"></div>
</main>
<!-- Aria-live region for screen reader announcements -->
<div id="aria-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- Settings Modal -->
<div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center">
  <div class="bg-surface-800 border border-gray-700/50 rounded-2xl shadow-2xl w-full max-w-md mx-4 fade-in">
    <div class="flex items-center justify-between p-5 border-b border-gray-700/50">
      <h2 class="font-semibold text-lg flex items-center gap-2"><i data-lucide="key" class="w-5 h-5 text-brand-400"></i> API Configuration</h2>
      <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">AI Provider</label>
        <select id="ai-provider" class="w-full bg-surface-900 border border-gray-600 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none">
          <option value="gemini">Google Gemini (2.5 Flash Preview)</option>
          <option value="anthropic">Anthropic Claude (3.5 Sonnet)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">API Key</label>
        <div class="relative">
          <input id="api-key" type="password" placeholder="Enter your API key..." class="w-full bg-surface-900 border border-gray-600 rounded-lg px-3 py-2.5 text-sm pr-10 focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none"/>
          <button onclick="toggleKeyVisibility()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white"><i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i></button>
        </div>
      </div>
      <button id="test-key-btn" onclick="testApiKey()" class="w-full border border-brand-500/40 text-brand-300 hover:bg-brand-500/10 font-medium py-2 rounded-lg transition-colors text-sm flex items-center justify-center gap-2"><i data-lucide="zap" class="w-4 h-4"></i> Test Key</button>
      <div class="bg-brand-500/10 border border-brand-500/20 rounded-lg p-3">
        <p class="text-xs text-brand-300 leading-relaxed">Your API key is stored locally in your browser and never sent to any server other than your chosen AI provider.</p>
      </div>
      <button onclick="saveSettings()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">Save Configuration</button>
      <div class="flex gap-2 pt-2 border-t border-gray-700/50">
        <button onclick="exportData()" class="flex-1 border border-gray-600 text-gray-300 hover:bg-gray-700/50 py-2 rounded-lg text-xs flex items-center justify-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> Export Data</button>
        <button onclick="importData()" class="flex-1 border border-gray-600 text-gray-300 hover:bg-gray-700/50 py-2 rounded-lg text-xs flex items-center justify-center gap-1"><i data-lucide="upload" class="w-3 h-3"></i> Import Data</button>
      </div>
    </div>
  </div>
</div>

<!-- Reset Confirmation Modal -->
<div id="reset-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center">
  <div class="bg-surface-800 border border-gray-700/50 rounded-2xl shadow-2xl w-full max-w-sm mx-4 fade-in">
    <div class="p-5 text-center">
      <div class="w-14 h-14 rounded-2xl bg-red-500/20 flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle" class="w-7 h-7 text-red-400"></i></div>
      <h3 class="text-lg font-bold text-white mb-2">Reset All Data?</h3>
      <p class="text-sm text-gray-400 mb-5">This will permanently delete all your saved strategies, scripts, and settings. This cannot be undone.</p>
      <div class="space-y-2">
        <button onclick="confirmReset(true)" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm flex items-center justify-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Backup & Reset</button>
        <button onclick="confirmReset(false)" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">Reset Without Backup</button>
        <button onclick="closeResetModal()" class="w-full border border-gray-600 text-gray-300 hover:bg-gray-700/50 py-2.5 rounded-lg text-sm">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Help Modal -->
<div id="help-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center">
  <div class="bg-surface-800 border border-gray-700/50 rounded-2xl shadow-2xl w-full max-w-lg mx-4 fade-in max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between p-5 border-b border-gray-700/50 shrink-0">
      <h2 id="help-modal-title" class="font-semibold text-lg flex items-center gap-2"><i data-lucide="help-circle" class="w-5 h-5 text-brand-400"></i> Help</h2>
      <button onclick="closeHelp()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="help-modal-body" class="p-5 overflow-y-auto"></div>
  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = 'ceo_copilot_state';
const defaultState = {
  currentStep: 0,
  apiProvider: 'gemini',
  apiKey: '',
  business: { name:'', industry:'', audience:'', usps:'' },
  persona: null,
  pitch: null,
  plan: null,
  kpiChecks: {},
  // Sales & Training state
  salesTab: 'scripts',
  discoveryScript: null,
  followUpPack: null,
  multiChannel: null,
  combinedFlow: null,
  spinScript: null,
  challengerSegment: null,
  sandlerFunnel: null,
  methodGuide: null,
  trainingDrills: null,
  trainingChecks: {},
  // Phase 2: Sales Execution Engine
  touchSequence: null,
  qualScorecard: null,
  qualScores: {},
  budgetFramework: null,
  budgetInputs: { monthly_budget: '', top_channels: '' },
  nurtureSequence: null,
  roiCalc: null,
  roiInputs: { deal_value: '', close_rate: '', leads_per_month: '', cost_per_lead: '', monthly_cost: '' },
  battlecards: null,
  battlecardInputs: { competitors: '' },
  // Phase 3: Coaching & Performance
  callRubric: null,
  callScores: {},
  objectionMastery: null,
  objectionConfidence: {},
  onboardingCurriculum: null,
  onboardingChecks: {},
  winLossFramework: null,
  winLossLog: [],
  perfDashboard: null,
  weeklyMetrics: { calls_made:'', emails_sent:'', meetings_booked:'', proposals_sent:'', deals_closed:'', revenue:'', pipeline_value:'' }
};
let state = loadState();

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? { ...defaultState, ...JSON.parse(s) } : { ...defaultState };
  } catch { return { ...defaultState }; }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// ============================================================
// NAV
// ============================================================
const steps = [
  { icon:'briefcase', label:'Business Intake', id:'intake' },
  { icon:'user-circle', label:'Buyer Persona', id:'persona' },
  { icon:'megaphone', label:'Sales Pitch', id:'pitch' },
  { icon:'layout-grid', label:'Marketing Plan', id:'plan' },
  { icon:'bar-chart-3', label:'Execution & Track', id:'execute' },
  { icon:'phone-call', label:'Calls & Training', id:'sales' },
  // Phase 2: Sales Execution Engine
  { icon:'repeat', label:'Touch Sequences', id:'sequences' },
  { icon:'clipboard-list', label:'Qualification', id:'scorecard' },
  { icon:'pie-chart', label:'Budget Allocator', id:'budget' },
  { icon:'mail', label:'Email Nurture', id:'nurture' },
  { icon:'calculator', label:'ROI Calculator', id:'roi' },
  { icon:'shield-alert', label:'Battlecards', id:'battlecards' },
  // Phase 3: Coaching & Performance
  { icon:'star', label:'Call Scoring', id:'callscore' },
  { icon:'trophy', label:'Objection Mastery', id:'objmastery' },
  { icon:'graduation-cap', label:'90-Day Onboarding', id:'onboarding' },
  { icon:'trending-up', label:'Win/Loss Analysis', id:'winloss' },
  { icon:'activity', label:'Performance', id:'performance' }
];

function renderNav() {
  const nav = document.getElementById('nav-steps');
  const marketingSteps = steps.slice(0,5);
  const salesSteps = steps.slice(5,6);
  const phase2Steps = steps.slice(6,12);
  const phase3Steps = steps.slice(12);

  let html = marketingSteps.map((s,i) => navBtn(s,i)).join('');
  html += `<div class="pt-2 mt-2 border-t border-gray-700/40"><p class="px-3 py-1 text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Sales Enablement</p></div>`;
  html += salesSteps.map((s,i) => navBtn(s, i + 5)).join('');
  html += `<div class="pt-2 mt-2 border-t border-gray-700/40"><p class="px-3 py-1 text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Sales Execution</p></div>`;
  html += phase2Steps.map((s,i) => navBtn(s, i + 6)).join('');
  html += `<div class="pt-2 mt-2 border-t border-gray-700/40"><p class="px-3 py-1 text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Coaching & Performance</p></div>`;
  html += phase3Steps.map((s,i) => navBtn(s, i + 12)).join('');

  nav.innerHTML = html;
  lucide.createIcons();
}

function navBtn(s, i) {
  const done = i < state.currentStep && i < 5;
  const active = i === state.currentStep;
  // Sales & Phase 2 steps (5+) accessible after persona + pitch exist
  const accessible = i <= state.currentStep || (i >= 5 && state.persona && state.pitch);
  return `<button onclick="${accessible ? `goToStep(${i})` : ''}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all ${active ? 'step-active font-semibold shadow-lg shadow-brand-500/20' : done ? 'text-green-400 hover:bg-gray-700/50' : accessible ? 'text-gray-300 hover:bg-gray-700/50' : 'text-gray-600 cursor-not-allowed'}">
    <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${active ? 'bg-white/20' : done ? 'bg-green-500/20' : 'bg-gray-700/50'}">
      ${done ? '<i data-lucide="check" class="w-4 h-4"></i>' : `<i data-lucide="${s.icon}" class="w-4 h-4"></i>`}
    </div>
    <span>${s.label}</span>
  </button>`;
}

function goToStep(i) { state.currentStep = i; saveState(); closeMobileMenu(); render(); }

// Mobile menu
function toggleMobileMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('active'); }
function closeMobileMenu() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('active'); }

// ============================================================
// SETTINGS
// ============================================================
function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); document.getElementById('settings-modal').classList.add('flex'); document.getElementById('ai-provider').value = state.apiProvider; document.getElementById('api-key').value = state.apiKey; lucide.createIcons(); }
function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); document.getElementById('settings-modal').classList.remove('flex'); }
function saveSettings() { state.apiProvider = document.getElementById('ai-provider').value; state.apiKey = document.getElementById('api-key').value; saveState(); closeSettings(); showToast('Settings saved'); }
function toggleKeyVisibility() { const el = document.getElementById('api-key'); el.type = el.type === 'password' ? 'text' : 'password'; }

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('theme-label').textContent = dark ? 'Light Mode' : 'Dark Mode';
  render();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, err=false) {
  const t = document.createElement('div');
  t.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-xl fade-in ${err ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`;
  t.setAttribute('role', 'alert');
  t.textContent = msg;
  document.body.appendChild(t);
  // Announce to screen readers
  const live = document.getElementById('aria-live');
  if (live) live.textContent = msg;
  setTimeout(() => t.remove(), 3000);
}

// ============================================================
// AI CALL
// ============================================================
// Temperature map per task type
const TEMP_MAP = {
  persona: 0.8, pitch: 0.9, plan: 0.7, discovery: 0.7, followup: 0.7,
  multichannel: 0.7, spin: 0.7, challenger: 0.8, sandler: 0.7,
  combined: 0.7, guide: 0.5, training: 0.7,
  touchseq: 0.7, qualification: 0.5, budget: 0.5, nurture: 0.7, roicalc: 0.4, battlecard: 0.7,
  callrubric: 0.5, objmastery: 0.6, onboarding: 0.6, winloss: 0.5, perfdash: 0.5,
  default: 0.7
};
function getTemp(taskType) { return TEMP_MAP[taskType] || TEMP_MAP.default; }

async function callAI(systemPrompt, userPrompt, taskType='default') {
  if (!state.apiKey) { showToast('Please set your API key first', true); openSettings(); throw new Error('No API key'); }
  const temp = getTemp(taskType);
  const MAX_RETRIES = 3;
  let lastError;

  for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
    try {
      if (attempt > 0) {
        const delay = Math.min(1000 * Math.pow(2, attempt), 8000);
        showToast(`Retry ${attempt}/${MAX_RETRIES-1}... (${delay/1000}s)`);
        await new Promise(r => setTimeout(r, delay));
      }
      const raw = await callProvider(systemPrompt, userPrompt, temp);
      const parsed = parseJSON(raw);
      // Basic schema validation: must be a non-null object
      if (!parsed || typeof parsed !== 'object') throw new Error('AI returned non-object JSON');
      return parsed;
    } catch(e) {
      lastError = e;
      if (e.message.includes('API key') || e.message.includes('401') || e.message.includes('403')) throw e; // Don't retry auth errors
    }
  }
  throw lastError;
}

async function callProvider(systemPrompt, userPrompt, temp) {
  if (state.apiProvider === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${state.apiKey}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ parts: [{ text: userPrompt }] }],
        generationConfig: { temperature: temp, responseMimeType: 'application/json' }
      })
    });
    if (!res.ok) { const e = await res.text(); throw new Error(`Gemini error: ${e}`); }
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  } else {
    const proxy = 'https://corsproxy.io/?';
    const url = `${proxy}https://api.anthropic.com/v1/messages`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-5-sonnet-20241022',
        max_tokens: 2048,
        temperature: temp,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    if (!res.ok) { const e = await res.text(); throw new Error(`Claude error: ${e}`); }
    const data = await res.json();
    return data.content?.[0]?.text || '';
  }
}

function parseJSON(raw) {
  let s = raw.trim();
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
  try { return JSON.parse(s); } catch {}
  const m = s.match(/\{[\s\S]*\}/);
  if (m) try { return JSON.parse(m[0]); } catch {}
  throw new Error('Could not parse AI response as JSON');
}

// ============================================================
// UTILITIES
// ============================================================
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function arrify(v) { return Array.isArray(v) ? v : (typeof v === 'string' ? v.split(/,\s*|;\s*|\n/).filter(Boolean) : [String(v||'')]); }

function sectionHeader(icon, title, subtitle) {
  const helpKey = title.toLowerCase().replace(/[^a-z0-9]/g,'_');
  const hasHelp = HELP_DATA[helpKey];
  return `<div class="mb-8 fade-in">
    <div class="flex items-center gap-3 mb-2">
      <div class="w-10 h-10 rounded-xl bg-brand-500/20 flex items-center justify-center"><i data-lucide="${icon}" class="w-5 h-5 text-brand-400"></i></div>
      <div class="flex-1"><h2 class="text-2xl font-bold text-white">${title}</h2><p class="text-sm text-gray-400">${subtitle}</p></div>
      ${hasHelp ? `<button onclick="openHelp('${helpKey}')" class="shrink-0 w-8 h-8 rounded-lg bg-brand-500/10 hover:bg-brand-500/20 border border-brand-500/20 flex items-center justify-center text-brand-400 hover:text-brand-300 transition-all" aria-label="Help for ${escH(title)}" title="How to use this section"><i data-lucide="help-circle" class="w-4 h-4"></i></button>` : ''}
    </div>
  </div>`;
}

function openHelp(key) {
  const h = HELP_DATA[key]; if (!h) return;
  const el = document.getElementById('help-modal');
  document.getElementById('help-modal-title').textContent = h.title;
  let body = '';
  body += `<div class="mb-4"><h4 class="text-xs font-semibold text-brand-400 uppercase mb-1.5">What is this?</h4><p class="text-sm text-gray-300 leading-relaxed">${escH(h.what)}</p></div>`;
  body += `<div class="mb-4"><h4 class="text-xs font-semibold text-green-400 uppercase mb-1.5">How to use it</h4><div class="text-sm text-gray-300 leading-relaxed space-y-1">${h.how.split('\n').map(l=>`<p>${escH(l)}</p>`).join('')}</div></div>`;
  body += `<div class="mb-4"><h4 class="text-xs font-semibold text-amber-400 uppercase mb-1.5">KPIs to track</h4><div class="space-y-1">${h.kpis.map(k=>`<div class="flex items-start gap-2 text-sm text-gray-300"><i data-lucide="target" class="w-3 h-3 text-amber-400 mt-1 shrink-0"></i>${escH(k)}</div>`).join('')}</div></div>`;
  body += `<div class="mb-4"><h4 class="text-xs font-semibold text-cyan-400 uppercase mb-1.5">Success factors</h4><div class="space-y-1">${h.success_factors.map(s=>`<div class="flex items-start gap-2 text-sm text-gray-300"><i data-lucide="trending-up" class="w-3 h-3 text-cyan-400 mt-1 shrink-0"></i>${escH(s)}</div>`).join('')}</div></div>`;
  if (h.pro_tip) body += `<div class="bg-brand-500/10 border border-brand-500/20 rounded-lg p-3"><p class="text-xs text-brand-300 leading-relaxed"><strong class="text-brand-200">Pro tip:</strong> ${escH(h.pro_tip)}</p></div>`;
  document.getElementById('help-modal-body').innerHTML = body;
  el.classList.remove('hidden'); el.classList.add('flex');
  lucide.createIcons();
}
function closeHelp() { const el = document.getElementById('help-modal'); el.classList.add('hidden'); el.classList.remove('flex'); }

  return `<div><label class="block text-sm font-medium text-gray-300 mb-1.5">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${escH(value||'')}" class="w-full bg-surface-900 border border-gray-600 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none"/></div>`;

function copyText(id, btnEl) {
  const el = document.getElementById(id);
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(() => {
      if (btnEl) { const orig = btnEl.innerHTML; btnEl.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> Copied!'; btnEl.classList.add('copied'); lucide.createIcons(); setTimeout(() => { btnEl.innerHTML = orig; btnEl.classList.remove('copied'); lucide.createIcons(); }, 1500); }
      else showToast('Copied!');
    }).catch(() => showToast('Copy failed', true));
  }
}

    'SPIN_I': ['SPIN: Implication Question', 'tag-spin-i'],

// Data Export / Import
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `copilot-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup downloaded');
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported || typeof imported !== 'object') throw new Error('Invalid');
        state = { ...defaultState, ...imported };
        saveState(); render();
        showToast('Data restored successfully');
      } catch { showToast('Invalid backup file', true); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

        body: JSON.stringify({ model:'claude-3-5-sonnet-20241022', max_tokens:10, messages:[{role:'user',content:'Say ok'}] }) });
      if (!res.ok) throw new Error(`${res.status}`);
      showToast('Claude API key is valid!');
    }
  } catch(e) { showToast(`Key test failed: ${e.message}`, true); }
  btn.disabled = false; btn.innerHTML = '<i data-lucide="zap" class="w-4 h-4"></i> Test Key'; lucide.createIcons();
}

function downloadText(filename, content) {
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadScriptPack() {
  let txt = `=== CALL SCRIPT PACK ===\n${state.business.name}\n\n`;
  if (state.discoveryScript) {
    const d = state.discoveryScript;
    txt += `--- DISCOVERY CALL ---\nPurpose: ${d.call_purpose||''}\n\nOpener:\n${d.opener||''}\n\nDiscovery Questions:\n${(d.discovery_questions||[]).map((q,i)=>`  ${i+1}. ${q}`).join('\n')}\n\nValue Statement:\n${d.value_statement||''}\n\nClose:\n${d.close_script||''}\n\nIf Busy:\n${d.fallback_if_busy||''}\n\n`;
  }
  if (state.followUpPack) {
    const f = state.followUpPack;
    txt += `--- FOLLOW-UP ---\n${f.follow_up_script?.opener||''}\n\n--- OBJECTIONS ---\n`;
    (f.objection_pack||[]).forEach((o,i) => { txt += `\n${i+1}. "${o.objection}"\n   Acknowledge: ${o.acknowledge}\n   Reframe: ${o.reframe}\n   Move Forward: ${o.question_to_move_forward}\n`; });
  }
  downloadText('call-scripts.txt', txt);
}

function downloadTrainingPack() {
  if (!state.trainingDrills) { showToast('Generate training first', true); return; }
  const t = state.trainingDrills;
  let txt = `=== SALES TRAINING PACK ===\n${state.business.name}\n\n`;
  txt += `METHODOLOGY: ${t.methodology_summary||''}\n\n`;
  if (t.one_page_playbook) {
    txt += `--- PLAYBOOK ---\nPrinciples:\n${arrify(t.one_page_playbook.core_principles).map(p=>`  - ${p}`).join('\n')}\n\nDo's:\n${arrify(t.one_page_playbook.do_s||t.one_page_playbook.dos||[]).map(d=>`  + ${d}`).join('\n')}\n\nDon'ts:\n${arrify(t.one_page_playbook.dont_s||t.one_page_playbook.donts||[]).map(d=>`  - ${d}`).join('\n')}\n\n`;
  }
  if (t.role_play_scenarios?.length) {
    txt += `--- ROLE-PLAYS ---\n`;
    t.role_play_scenarios.forEach((r,i) => { txt += `\n${i+1}. ${r.title}\n   Setup: ${r.setup}\n   Goal: ${r.rep_goal}\n   Prospect: ${r.prospect_profile}\n   Twist: ${r.twist_or_objection}\n`; });
    txt += '\n';
  }
  const allDrills = [...(t.microlearning_drills||[]), ...(t.spin_drills||[]), ...(t.challenger_drills||[]), ...(t.pain_funnel_drills||[])];
  if (allDrills.length) {
    txt += `--- DRILLS ---\n`;
    allDrills.forEach(d => { txt += `\n${d.name} (${d.time_needed_minutes} min)\n${d.instructions}\n`; });
    txt += '\n';
  }
  if (t.self_coaching_checklist?.length) {
    txt += `--- SELF-COACHING ---\n${t.self_coaching_checklist.map(c=>`  [ ] ${c}`).join('\n')}\n`;
  }
  downloadText('training-pack.txt', txt);
}

      <p class="text-gray-300">Generate a custom qualification scorecard that combines BANT (Budget, Authority, Need, Timeline) and MEDDIC (Metrics, Economic Buyer, Decision Criteria, Decision Process, Identify Pain, Champion) for your business.</p>
      ${genBtn('gen-qual-btn','Generate Scorecard','generateQualScorecard()')}
    </div>`;
  } else {
    const q = state.qualScorecard;
    // BANT Section
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <div class="flex items-center gap-2 mb-4"><i data-lucide="target" class="w-5 h-5 text-blue-400"></i><h3 class="font-semibold text-blue-300">BANT Criteria</h3></div>
      <div class="grid md:grid-cols-2 gap-4">`;
    (q.bant||[]).forEach((item,i) => {
      const score = state.qualScores[`bant_${i}`] || 0;
      html += `<div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30">
        <div class="flex items-center justify-between mb-2"><h4 class="font-semibold text-sm text-white">${escH(item.criterion||'')}</h4>
          <div class="flex gap-1">${[1,2,3,4,5].map(n => `<button onclick="scoreQual('bant_${i}',${n})" class="w-7 h-7 rounded-lg text-xs font-bold transition-all ${score>=n?'bg-blue-500 text-white':'bg-gray-700 text-gray-400 hover:bg-gray-600'}">${n}</button>`).join('')}</div>
        </div>
        <p class="text-xs text-gray-400 mb-2">${escH(item.description||'')}</p>
        <div class="space-y-1">${arrify(item.questions||[]).map(qq=>`<p class="text-xs text-gray-300 pl-2 border-l-2 border-blue-500/30">${escH(qq)}</p>`).join('')}</div>
      </div>`;
    });
    html += `</div></div>`;

    // MEDDIC Section
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <div class="flex items-center gap-2 mb-4"><i data-lucide="shield-check" class="w-5 h-5 text-green-400"></i><h3 class="font-semibold text-green-300">MEDDIC Criteria</h3></div>
      <div class="grid md:grid-cols-2 gap-4">`;
    (q.meddic||[]).forEach((item,i) => {
      const score = state.qualScores[`meddic_${i}`] || 0;
      html += `<div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30">
        <div class="flex items-center justify-between mb-2"><h4 class="font-semibold text-sm text-white">${escH(item.criterion||'')}</h4>
          <div class="flex gap-1">${[1,2,3,4,5].map(n => `<button onclick="scoreQual('meddic_${i}',${n})" class="w-7 h-7 rounded-lg text-xs font-bold transition-all ${score>=n?'bg-green-500 text-white':'bg-gray-700 text-gray-400 hover:bg-gray-600'}">${n}</button>`).join('')}</div>
        </div>
        <p class="text-xs text-gray-400 mb-2">${escH(item.description||'')}</p>
        <div class="space-y-1">${arrify(item.questions||[]).map(qq=>`<p class="text-xs text-gray-300 pl-2 border-l-2 border-green-500/30">${escH(qq)}</p>`).join('')}</div>
      </div>`;
    });
    html += `</div></div>`;

    // Score Summary
    const bantKeys = (q.bant||[]).map((_,i)=>`bant_${i}`);
    const meddicKeys = (q.meddic||[]).map((_,i)=>`meddic_${i}`);
    const bantTotal = bantKeys.reduce((s,k)=>s+(state.qualScores[k]||0),0);
    const meddicTotal = meddicKeys.reduce((s,k)=>s+(state.qualScores[k]||0),0);
    const bantMax = bantKeys.length*5;
    const meddicMax = meddicKeys.length*5;
    const totalPct = bantMax+meddicMax>0 ? Math.round((bantTotal+meddicTotal)/(bantMax+meddicMax)*100) : 0;
    const grade = totalPct>=80?'A - Strong Opportunity':totalPct>=60?'B - Promising, Needs Work':totalPct>=40?'C - Early Stage':totalPct>=20?'D - Unqualified':'F - Not a Fit';
    const gradeColor = totalPct>=80?'green':totalPct>=60?'blue':totalPct>=40?'amber':'red';

    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">

      <div class="grid md:grid-cols-3 gap-4 text-center">
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-blue-400">${bantTotal}/${bantMax}</p><p class="text-xs text-gray-500">BANT Score</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-green-400">${meddicTotal}/${meddicMax}</p><p class="text-xs text-gray-500">MEDDIC Score</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-${gradeColor}-500/30"><p class="text-2xl font-bold text-${gradeColor}-400">${totalPct}%</p><p class="text-xs text-gray-500">${grade}</p></div>
      </div>
      ${q.scoring_guide ? `<p class="text-xs text-gray-400 mt-3">${escH(q.scoring_guide)}</p>` : ''}
    </div>`;

    html += `<div class="flex gap-3 no-print">
      <button onclick="state.qualScorecard=null;state.qualScores={};saveState();render();" class="px-5 py-2.5 rounded-xl border border-gray-600 text-gray-300 hover:bg-gray-700/50 text-sm">Regenerate</button>
    </div>`;
  }
  html += `</div>`;
  c.innerHTML = html; lucide.createIcons();
}

function renderROICalculator(c) {
  const need = !state.persona || !state.pitch;
  if (need) { c.innerHTML = phase2Gate('calculator','ROI Calculator'); return; }

  let html = sectionHeader('calculator','Proposal & ROI Calculator','Model revenue impact and build a compelling business case.');
  html += `<div class="space-y-6 fade-in">`;

  const ri = state.roiInputs;
  html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
    <h3 class="font-semibold text-white mb-4 flex items-center gap-2"><i data-lucide="sliders" class="w-4 h-4 text-brand-400"></i> ROI Parameters</h3>
    <div class="grid md:grid-cols-3 gap-4">
      ${inputField('roi-deal','Average Deal Value ($)','e.g. 5000', ri.deal_value)}
      ${inputField('roi-close','Close Rate (%)','e.g. 20', ri.close_rate)}
      ${inputField('roi-leads','Leads per Month','e.g. 50', ri.leads_per_month)}
      ${inputField('roi-cpl','Cost per Lead ($)','e.g. 30', ri.cost_per_lead)}
      ${inputField('roi-cost','Monthly Marketing Spend ($)','e.g. 5000', ri.monthly_cost)}
    </div>
    <div class="mt-4 flex gap-3">
      <button onclick="calculateROILocal()" class="bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 px-6 rounded-xl text-sm inline-flex items-center gap-2"><i data-lucide="calculator" class="w-4 h-4"></i> Calculate Now</button>
      ${genBtn('gen-roi-btn','AI Proposal','generateROIProposal()')}
    </div>
  </div>`;

  // Live calculator results
  if (ri.deal_value && ri.close_rate && ri.leads_per_month) {
    const dv = parseFloat(ri.deal_value)||0, cr = (parseFloat(ri.close_rate)||0)/100, lpm = parseFloat(ri.leads_per_month)||0;
    const cpl = parseFloat(ri.cost_per_lead)||0, mc = parseFloat(ri.monthly_cost)||0;
    const monthlyDeals = lpm * cr;
    const monthlyRev = monthlyDeals * dv;
    const annualRev = monthlyRev * 12;
    const monthlyProfit = monthlyRev - mc;
    const roi = mc > 0 ? Math.round((monthlyProfit / mc) * 100) : 0;
    const roiColor = roi >= 200 ? 'green' : roi >= 100 ? 'blue' : roi >= 0 ? 'amber' : 'red';

    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <h3 class="font-semibold text-white mb-4 flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-green-400"></i> Projected Results</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-blue-400">${monthlyDeals.toFixed(1)}</p><p class="text-xs text-gray-500">Deals/Month</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-green-400">$${monthlyRev.toLocaleString()}</p><p class="text-xs text-gray-500">Monthly Revenue</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-purple-400">$${annualRev.toLocaleString()}</p><p class="text-xs text-gray-500">Annual Revenue</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-${roiColor}-500/30"><p class="text-2xl font-bold text-${roiColor}-400">${roi}%</p><p class="text-xs text-gray-500">ROI</p></div>
      </div>
      ${mc>0 ? `<p class="text-sm text-gray-400 mt-3">Net monthly profit: <strong class="text-${monthlyProfit>=0?'green':'red'}-400">$${monthlyProfit.toLocaleString()}</strong> after $${mc.toLocaleString()} spend. Breakeven at ${mc>0?(mc/dv/cr).toFixed(0):0} leads/month.</p>` : ''}
    </div>`;
  }

  // AI Proposal
  if (state.roiCalc) {
    const r = state.roiCalc;
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <div class="flex items-center gap-2 mb-4"><i data-lucide="file-check" class="w-5 h-5 text-brand-400"></i><h3 class="font-semibold text-brand-300">AI-Generated Proposal</h3></div>
      <div class="space-y-4">`;
    if (r.executive_summary) html += `<div><h4 class="text-xs font-semibold text-gray-500 uppercase mb-1">Executive Summary</h4>${copyBlock(r.executive_summary,'cp-roi-exec')}</div>`;
    if (r.investment_breakdown?.length) {
      html += `<div><h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Investment Breakdown</h4><div class="space-y-2">${r.investment_breakdown.map((ib,i)=>`<div class="flex items-center justify-between bg-surface-900 rounded-lg p-3 border border-gray-700/30"><span class="text-sm text-gray-200">${escH(ib.item||'')}</span><span class="text-sm font-bold text-white">$${escH(ib.cost||'')}</span></div>`).join('')}</div></div>`;

    if (r.projected_outcomes?.length) {

async function generateBattlecards() {
  const comps = document.getElementById('bc-competitors')?.value.trim() || '';
  state.battlecardInputs = { competitors: comps }; saveState();
  if (!comps) { showToast('Enter at least one competitor', true); return; }
  setLoading('gen-battlecard-btn');
  try {
    state.battlecards = await callAI('Act as a competitive intelligence analyst.',
      `Create competitive battlecards for:\n${getBD()}\nPitch: ${JSON.stringify(state.pitch)}\nCompetitors: ${comps}\nFor each competitor provide: name, threat level (High/Medium/Low), strengths, weaknesses, our differentiators, and 2-3 common objections with responses.\nAlso provide overall win themes and loss themes.\nReturn ONLY valid JSON:\n{"competitors":[{"name":"","threat_level":"","strengths":[],"weaknesses":[],"our_differentiators":[],"objections":[{"objection":"","response":""}]}],"win_themes":[],"loss_themes":[]}`, 'battlecard');
    saveState(); render();
  } catch(e) { showToast(e.message, true); resetBtn('gen-battlecard-btn','Generate Battlecards'); }
}

function downloadBattlecards() {
  if (!state.battlecards) return;
  let txt = `=== COMPETITIVE BATTLECARDS ===\n${state.business.name}\n\n`;
  (state.battlecards.competitors||[]).forEach(comp => {
    txt += `\n=== ${(comp.name||'').toUpperCase()} (${comp.threat_level||''} threat) ===\n`;
    txt += `Strengths:\n${(comp.strengths||[]).map(s=>`  - ${s}`).join('\n')}\n`;
    txt += `Weaknesses:\n${(comp.weaknesses||[]).map(w=>`  - ${w}`).join('\n')}\n`;
    txt += `Our Differentiators:\n${(comp.our_differentiators||[]).map(d=>`  * ${d}`).join('\n')}\n`;
    if (comp.objections?.length) {
      txt += `Objections:\n`;
      comp.objections.forEach(o => { txt += `  "${o.objection}"\n  → ${o.response}\n`; });
    }
  });
  if (state.battlecards.win_themes?.length) txt += `\nWin Themes:\n${state.battlecards.win_themes.map(w=>`  + ${w}`).join('\n')}\n`;
  if (state.battlecards.loss_themes?.length) txt += `\nLoss Themes:\n${state.battlecards.loss_themes.map(l=>`  - ${l}`).join('\n')}\n`;
  downloadText('battlecards.txt', txt);
}

  setLoading('gen-onboard-btn');

    state.onboardingCurriculum = await callAI('Act as a sales enablement director.',
      `Create a 90-day sales onboarding curriculum for:\n${getBD()}\n4 phases: Foundation (Weeks 1-2), Shadow & Learn (Weeks 3-5), Solo Practice (Weeks 6-9), Full Cycle (Weeks 10-13).\nEach phase: name, timeframe, description, gate criteria for progression, and 4-6 milestones with week numbers.\nReturn ONLY valid JSON:\n{"phases":[{"phase_name":"Foundation","timeframe":"Weeks 1-2","description":"","gate":"Pass product knowledge quiz","milestones":[{"milestone":"Complete product training","details":"","week":1}]}]}`, 'onboarding');
    saveState(); render();
  } catch(e) { showToast(e.message, true); resetBtn('gen-onboard-btn','Generate Curriculum'); }
}

// ============================================================
// PHASE 3: WIN/LOSS ANALYSIS FRAMEWORK
// ============================================================
function renderWinLoss(c) {
  const need = !state.persona || !state.pitch;
  if (need) { c.innerHTML = phase2Gate('trending-up','Win/Loss Analysis'); return; }
  let html = sectionHeader('trending-up','Win/Loss Analysis Framework','Review deals, track patterns, and refine your approach based on data.');
  html += '<div class="space-y-6 fade-in">';
  if (!state.winLossFramework) {
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow text-center space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-brand-500/20 flex items-center justify-center mx-auto"><i data-lucide="trending-up" class="w-8 h-8 text-brand-400"></i></div>
      <p class="text-gray-300">Generate a structured win/loss review framework with review criteria, common reasons, and a feedback loop template.</p>
      ${genBtn('gen-winloss-btn','Generate Framework','generateWinLoss()')}
    </div>`;
  } else {
    const wl = state.winLossFramework;
    // Review form
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <h3 class="font-semibold text-white mb-4 flex items-center gap-2"><i data-lucide="file-plus" class="w-4 h-4 text-brand-400"></i> Log a Deal Review</h3>
      <div class="grid md:grid-cols-3 gap-3">
        ${inputField('wl-deal','Deal Name','e.g. Acme Corp','')}
        <div><label class="block text-sm font-medium text-gray-300 mb-1.5">Outcome</label>
          <select id="wl-outcome" class="w-full bg-surface-900 border border-gray-600 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none">
            <option value="won">Won</option><option value="lost">Lost</option><option value="stalled">Stalled</option>
          </select></div>
        ${inputField('wl-reason','Primary Reason','e.g. Price too high','')}
      </div>
      ${inputField('wl-lessons','Key Lessons / Notes','What would you do differently?','','text','textarea')}
      <button onclick="logWinLoss()" class="mt-3 bg-brand-600 hover:bg-brand-500 text-white font-medium py-2.5 px-6 rounded-xl text-sm">Log Review</button>
    </div>`;
    // Review criteria
    if (wl.review_criteria?.length) {
      html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
        <h3 class="font-semibold text-brand-300 mb-4 flex items-center gap-2"><i data-lucide="clipboard-check" class="w-4 h-4"></i> Post-Deal Review Checklist</h3>
        <div class="grid md:grid-cols-2 gap-3">${wl.review_criteria.map(cr=>`<div class="bg-surface-900 rounded-xl p-3 border border-gray-700/30">
          <h4 class="text-sm font-semibold text-white mb-1">${escH(cr.criterion||'')}</h4>
          <p class="text-xs text-gray-400">${escH(cr.question||'')}</p>
        </div>`).join('')}</div>
      </div>`;
    }
    // Common reasons
    if (wl.common_win_reasons?.length || wl.common_loss_reasons?.length) {
      html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
        <h3 class="font-semibold text-white mb-4">Common Win & Loss Reasons</h3>
        <div class="grid md:grid-cols-2 gap-4">
          <div><h4 class="text-xs font-semibold text-green-400 uppercase mb-2">Win Reasons</h4><div class="space-y-1">${arrify(wl.common_win_reasons||[]).map(r=>`<p class="text-sm text-gray-300 flex items-start gap-2"><i data-lucide="check-circle" class="w-3 h-3 text-green-400 mt-1 shrink-0"></i>${escH(r)}</p>`).join('')}</div></div>
          <div><h4 class="text-xs font-semibold text-red-400 uppercase mb-2">Loss Reasons</h4><div class="space-y-1">${arrify(wl.common_loss_reasons||[]).map(r=>`<p class="text-sm text-gray-300 flex items-start gap-2"><i data-lucide="x-circle" class="w-3 h-3 text-red-400 mt-1 shrink-0"></i>${escH(r)}</p>`).join('')}</div></div>
        </div>
      </div>`;
    }
    // Logged reviews
    if (state.winLossLog.length) {
      const wins = state.winLossLog.filter(l=>l.outcome==='won').length;
      const losses = state.winLossLog.filter(l=>l.outcome==='lost').length;
      const stalled = state.winLossLog.filter(l=>l.outcome==='stalled').length;
      html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
        <div class="flex items-center justify-between mb-4"><h3 class="font-semibold text-white flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-brand-400"></i> Deal Log</h3>
          <div class="flex gap-2"><span class="text-xs bg-green-500/20 text-green-300 px-2 py-0.5 rounded-full">${wins} won</span><span class="text-xs bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full">${losses} lost</span><span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full">${stalled} stalled</span></div>
        </div>
        <div class="space-y-2">${state.winLossLog.slice(-10).reverse().map((l,i)=>{
          const oc = l.outcome==='won'?'green':l.outcome==='lost'?'red':'amber';
          return `<div class="bg-surface-900 rounded-lg p-3 border border-gray-700/30 flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-${oc}-400 shrink-0"></span>
            <div class="flex-1 min-w-0"><p class="text-sm text-white truncate">${escH(l.deal||'')}</p><p class="text-xs text-gray-500">${escH(l.reason||'')} &bull; ${escH(l.date||'')}</p></div>
            <button onclick="state.winLossLog.splice(state.winLossLog.length-1-${i},1);saveState();render();" class="text-xs text-gray-600 hover:text-red-400 shrink-0">Remove</button>
          </div>`;
        }).join('')}</div>
      </div>`;
    }
    html += `<div class="flex gap-3 no-print"><button onclick="state.winLossFramework=null;state.winLossLog=[];saveState();render();" class="px-5 py-2.5 rounded-xl border border-gray-600 text-gray-300 hover:bg-gray-700/50 text-sm">Regenerate</button></div>`;
  }
  html += '</div>'; c.innerHTML = html; lucide.createIcons();
}
function logWinLoss() {
  const deal = document.getElementById('wl-deal')?.value.trim();
  const outcome = document.getElementById('wl-outcome')?.value;
  const reason = document.getElementById('wl-reason')?.value.trim();
  const lessons = document.getElementById('wl-lessons')?.value.trim();
  if (!deal) { showToast('Enter a deal name', true); return; }
  state.winLossLog.push({ deal, outcome, reason, lessons, date: new Date().toLocaleDateString() });
  saveState(); render(); showToast('Deal review logged');
}
async function generateWinLoss() {
  setLoading('gen-winloss-btn');
  try {
    state.winLossFramework = await callAI('Act as a sales operations analyst.',
      `Create a win/loss analysis framework for:\n${getBD()}\nPersona: ${JSON.stringify(state.persona)}\nInclude: 6-8 review criteria (with questions to ask after each deal), 5 common win reasons, 5 common loss reasons for this industry.\nReturn ONLY valid JSON:\n{"review_criteria":[{"criterion":"","question":""}],"common_win_reasons":[],"common_loss_reasons":[],"feedback_loop_tips":[]}`, 'winloss');
    saveState(); render();
  } catch(e) { showToast(e.message, true); resetBtn('gen-winloss-btn','Generate Framework'); }
}

// ============================================================
// PHASE 3: PERFORMANCE DASHBOARD (WEEKLY LOOP)
// ============================================================
function renderPerfDashboard(c) {
  const need = !state.persona || !state.pitch;
  if (need) { c.innerHTML = phase2Gate('activity','Performance Dashboard'); return; }
  let html = sectionHeader('activity','Performance Dashboard (Weekly Loop)','Track weekly metrics and get AI optimization suggestions.');
  html += '<div class="space-y-6 fade-in">';
  const wm = state.weeklyMetrics;
  // Metric input
  html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
    <h3 class="font-semibold text-white mb-4 flex items-center gap-2"><i data-lucide="edit-3" class="w-4 h-4 text-brand-400"></i> This Week's Numbers</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${inputField('pm-calls','Calls Made','0', wm.calls_made)}
      ${inputField('pm-emails','Emails Sent','0', wm.emails_sent)}
      ${inputField('pm-meetings','Meetings Booked','0', wm.meetings_booked)}
      ${inputField('pm-proposals','Proposals Sent','0', wm.proposals_sent)}
      ${inputField('pm-deals','Deals Closed','0', wm.deals_closed)}
      ${inputField('pm-revenue','Revenue ($)','0', wm.revenue)}
      ${inputField('pm-pipeline','Pipeline Value ($)','0', wm.pipeline_value)}
    </div>
    <div class="mt-4 flex gap-3">
      <button onclick="saveWeeklyMetrics()" class="bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 px-6 rounded-xl text-sm inline-flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Save Metrics</button>
      ${genBtn('gen-perfinsights-btn','Get AI Insights','generatePerfInsights()')}
    </div>
  </div>`;
  // Dashboard cards
  if (wm.calls_made || wm.emails_sent || wm.meetings_booked) {
    const calls=parseInt(wm.calls_made)||0, emails=parseInt(wm.emails_sent)||0, meetings=parseInt(wm.meetings_booked)||0;
    const proposals=parseInt(wm.proposals_sent)||0, deals=parseInt(wm.deals_closed)||0, rev=parseFloat(wm.revenue)||0, pipe=parseFloat(wm.pipeline_value)||0;
    const callToMeeting = calls>0?(meetings/calls*100).toFixed(1):0;
    const meetingToDeal = meetings>0?(deals/meetings*100).toFixed(1):0;
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <h3 class="font-semibold text-white mb-4 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-brand-400"></i> Weekly Snapshot</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-blue-400">${calls}</p><p class="text-xs text-gray-500">Calls</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-cyan-400">${emails}</p><p class="text-xs text-gray-500">Emails</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-green-400">${meetings}</p><p class="text-xs text-gray-500">Meetings</p></div>
        <div class="bg-surface-900 rounded-xl p-4 border border-gray-700/30"><p class="text-2xl font-bold text-amber-400">${deals}</p><p class="text-xs text-gray-500">Deals Closed</p></div>
      </div>
      <div class="grid md:grid-cols-3 gap-3 mt-3">
        <div class="bg-surface-900 rounded-xl p-3 border border-gray-700/30 text-center"><p class="text-lg font-bold text-purple-400">${callToMeeting}%</p><p class="text-xs text-gray-500">Call → Meeting Rate</p></div>
        <div class="bg-surface-900 rounded-xl p-3 border border-gray-700/30 text-center"><p class="text-lg font-bold text-green-400">${meetingToDeal}%</p><p class="text-xs text-gray-500">Meeting → Deal Rate</p></div>
        <div class="bg-surface-900 rounded-xl p-3 border border-gray-700/30 text-center"><p class="text-lg font-bold text-brand-400">$${rev.toLocaleString()}</p><p class="text-xs text-gray-500">Revenue</p></div>
      </div>
    </div>`;
  }
  // AI Insights
  if (state.perfDashboard) {
    const pd = state.perfDashboard;
    html += `<div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow">
      <h3 class="font-semibold text-brand-300 mb-4 flex items-center gap-2"><i data-lucide="sparkles" class="w-5 h-5"></i> AI Optimization Insights</h3>`;
    if (pd.assessment) html += `<div class="bg-brand-500/10 border border-brand-500/20 rounded-lg p-4 mb-4"><p class="text-sm text-gray-300">${escH(pd.assessment)}</p></div>`;
    if (pd.priorities?.length) {
      html += `<h4 class="text-xs font-semibold text-amber-400 uppercase mb-2">This Week's Focus Areas</h4><div class="space-y-2 mb-4">${pd.priorities.map((p,i)=>`<div class="flex items-start gap-3 bg-surface-900 rounded-lg p-3 border border-gray-700/30">
        <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 flex items-center justify-center text-xs font-bold shrink-0">${i+1}</span>
        <div><p class="text-sm text-white font-medium">${escH(p.action||'')}</p><p class="text-xs text-gray-400">${escH(p.rationale||'')}</p></div>
      </div>`).join('')}</div>`;
    }
    if (pd.benchmarks?.length) {
      html += `<h4 class="text-xs font-semibold text-cyan-400 uppercase mb-2">Industry Benchmarks</h4><div class="grid md:grid-cols-2 gap-2 mb-4">${pd.benchmarks.map(b=>`<div class="bg-surface-900 rounded-lg p-3 border border-gray-700/30"><p class="text-sm text-white">${escH(b.metric||'')}</p><p class="text-xs text-gray-400">Your: <strong class="text-cyan-300">${escH(b.your_value||'')}</strong> | Benchmark: <strong class="text-gray-300">${escH(b.benchmark||'')}</strong></p></div>`).join('')}</div>`;
    }
    if (pd.weekly_report) {
      html += `<h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Weekly Summary (Share with Team)</h4>${copyBlock(pd.weekly_report,'cp-weekly-report')}`;
    }
    html += `</div>`;
    html += `<div class="flex gap-3 no-print"><button onclick="state.perfDashboard=null;saveState();render();" class="px-5 py-2.5 rounded-xl border border-gray-600 text-gray-300 hover:bg-gray-700/50 text-sm">Regenerate Insights</button></div>`;
  }
  html += '</div>'; c.innerHTML = html; lucide.createIcons();
}
function saveWeeklyMetrics() {
  state.weeklyMetrics = {
    calls_made: document.getElementById('pm-calls')?.value.trim()||'',
    emails_sent: document.getElementById('pm-emails')?.value.trim()||'',
    meetings_booked: document.getElementById('pm-meetings')?.value.trim()||'',
    proposals_sent: document.getElementById('pm-proposals')?.value.trim()||'',
    deals_closed: document.getElementById('pm-deals')?.value.trim()||'',
    revenue: document.getElementById('pm-revenue')?.value.trim()||'',
    pipeline_value: document.getElementById('pm-pipeline')?.value.trim()||''
  };
  saveState(); render(); showToast('Metrics saved');
}
async function generatePerfInsights() {
  saveWeeklyMetrics();
  setLoading('gen-perfinsights-btn');
  const wm = state.weeklyMetrics;
  try {
    state.perfDashboard = await callAI('Act as a sales performance coach.',
      `Analyze these weekly metrics for:\n${getBD()}\nCalls: ${wm.calls_made||0}, Emails: ${wm.emails_sent||0}, Meetings: ${wm.meetings_booked||0}, Proposals: ${wm.proposals_sent||0}, Deals closed: ${wm.deals_closed||0}, Revenue: $${wm.revenue||0}, Pipeline: $${wm.pipeline_value||0}\nProvide: overall assessment, 3 priority actions with rationale, industry benchmarks for each metric, and a short weekly summary report to share.\nReturn ONLY valid JSON:\n{"assessment":"","priorities":[{"action":"","rationale":""}],"benchmarks":[{"metric":"","your_value":"","benchmark":""}],"weekly_report":""}`, 'perfdash');
    saveState(); render();
  } catch(e) { showToast(e.message, true); resetBtn('gen-perfinsights-btn','Get AI Insights'); }
}

// ============================================================
// PHASE 2: HELPER — Gate for prerequisites
// ============================================================
function phase2Gate(icon, title) {
  return `${sectionHeader(icon, title, 'Complete the Buyer Persona and Sales Pitch steps first.')}
  <div class="bg-surface-800 border border-gray-700/50 rounded-2xl p-6 card-glow text-center">
    <p class="text-gray-400">You need a buyer persona and sales pitch before using this module.</p>
    <button onclick="goToStep(1)" class="mt-4 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 px-6 rounded-xl text-sm">Go to Buyer Persona</button>
  </div>`;
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
